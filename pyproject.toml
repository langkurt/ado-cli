[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ado-cli"
version = "0.1.0"
description = "Azure DevOps CLI for Claude Code"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "azure-devops>=7.1.0b4",
    "msrest>=0.7",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
ado = "ado.cli:_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ado*"]
